[project]
name = "kto-titanic"
version = "0.1.0"
description = "Kto Titanic Project"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fire>=0.7.1",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
]

[project.scripts]
hello = "titanic.main:main"
api = "titanic.api.main:main"
chatbot = "titanic.chatbot.app:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]

api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.37.0",
    "PyJWT>=2.10.0",
    "cryptography>=46.0.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi", 
    "opentelemetry-exporter-otlp-proto-http",
]

training = [
    "mlflow[extras]==3.8.1",
    "setuptools==80.9.0",
    "ydata-profiling==4.18.0",
]

chatbot = [
    "streamlit>=1.40.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.2.1",
    "httpx>=0.28.0",
]

mcp-server = [
    "uvicorn>=0.37.0",
    "fastmcp>=0.4.0",
    "httpx>=0.28.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=3.7.1",
    "ruff>=0.14.9",
    "pyright>=1.1.407",
    "httpx>=0.28.0",
]